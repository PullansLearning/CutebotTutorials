<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Cutebot</title>
<meta name="edux-offline-fallback" content="1">
<meta name="theme-color" content="#0a5718">
<link rel="manifest" href="/CutebotTutorials/manifest.json">
<style>:root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:#fefcf6; color:#2a2d4f;
         font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .card { max-width:30rem; text-align:center; background:#fff; border:1.5px solid #e8eaf6;
          border-radius:20px; padding:32px 28px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
  .mark { font-size:3rem; line-height:1; margin-bottom:12px; }
  h1 { font-size:1.35rem; margin:0 0 10px; }
  p  { font-size:1rem; line-height:1.6; color:#6b7090; margin:0 0 20px; }
  a  { display:inline-block; background:#0a5718; color:#fff; text-decoration:none;
        font-weight:700; border-radius:999px; padding:11px 22px; }
  a:focus-visible { outline:3px solid #2a2d4f; outline-offset:3px; }</style></head>
<body><main class="card">
  <div class="mark">📡</div>
  <h1>This page isn't saved yet</h1>
  <p>You're offline, and this page hasn't been opened on this device before.
     Connect to the internet once and open it — after that it works offline.</p>
  <a href="/CutebotTutorials/">Go to Cutebot home</a>
</main>
<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load', function () {
navigator.serviceWorker.register("/CutebotTutorials/sw.js", { scope: "/CutebotTutorials/" }).catch(function () {});
});
}
</script>
</body></html>
